<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}
  <body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    {%- include header.html -%}
    <main id="main-content" class="page-content" aria-label="Conteúdo principal" tabindex="-1">
      <div class="wrapper">
        {%- if page.title and page.title != "" -%}
          <h1 class="page-heading">{{ page.title | escape }}</h1>
        {%- endif -%}
        {{ content }}
      </div>
    </main>
    {%- include footer.html -%}
  </body>
</html>
