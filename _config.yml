title: "2ex-lab"
description: "Conhecimento, experimentação e possibilidades sobre dupla excepcionalidade, neurodiversidade, aprendizagem e acessibilidade."
url: "https://2ex-lab.github.io"
baseurl: ""
lang: "pt-BR"
timezone: "America/Recife"

email: "2exlab.studio@gmail.com"
contact_email: "2exlab.studio@gmail.com"

remote_theme: "mmistakes/jekyll-theme-basically-basic@1.4.5"

markdown: kramdown
permalink: /:categories/:title/
show_excerpts: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      read_time: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .github/
  - scripts/
